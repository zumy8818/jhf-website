<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牧場日記 | 株式会社阿蘇J・Hファーム</title>
    <meta name="description" content="㈱阿蘇J・Hファームの牧場日記。産山高原の牧場から、日々の牛との時間・季節の移ろい・農場スタッフの想いをお届けします。">
    <meta property="og:title" content="牧場日記 | 株式会社阿蘇J・Hファーム">
    <meta property="og:description" content="産山高原の牧場から、日々の風景と牛づくりの様子をお届けします。">
    <meta property="og:type" content="article">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 共通レイアウト（index.htmlと揃える） */
        body { margin: 0; font-family: "Hiragino Mincho ProN", serif; color: #333; background: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #fff; border-bottom: 1px solid #eee; }
        header .logo { font-weight: bold; font-size: 1.1rem; }
        header nav a { color: #333; text-decoration: none; margin: 0 6px; }
        header nav a:hover { color: #004d40; text-decoration: underline; }

        /* 牧場日記ページ専用 */
        .diary-hero {
            background: #f5f1ea;
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid #e7e0d3;
        }
        .diary-hero h1 {
            font-size: 2.2rem;
            letter-spacing: 0.1em;
            margin: 0 0 12px;
            color: #2c2c2c;
        }
        .diary-hero p {
            color: #666;
            font-size: 1rem;
            margin: 0;
        }

        .diary-section {
            padding: 60px 20px;
            max-width: 880px;
            margin: 0 auto;
            text-align: center;
        }
        .diary-section .lead {
            margin-bottom: 40px;
            color: #555;
            line-height: 1.8;
        }

        /* Facebook埋め込みラッパー（左右余白＋中央寄せ） */
        .fb-wrapper {
            display: flex;
            justify-content: center;
            padding: 0 16px;
            margin: 0 auto;
        }
        .fb-wrapper .fb-page {
            max-width: 100%;
        }

        /* フッター */
        footer {
            background: #2c2c2c;
            color: #ddd;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.85rem;
            margin-top: 60px;
        }
        footer a { color: #ddd; text-decoration: none; margin: 0 8px; }

        /* スマホ対応 */
        @media screen and (max-width: 768px) {
            header { flex-direction: column; padding: 15px; text-align: center; }
            header nav { margin-top: 10px; font-size: 0.85rem; }
            .diary-hero { padding: 40px 16px 30px; }
            .diary-hero h1 { font-size: 1.6rem; }
            .diary-section { padding: 40px 12px; }
            .fb-wrapper { padding: 0 4px; }
        }
    </style>
</head>
<body>
    <!-- Facebook SDK のルート要素 -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous"
        src="https://connect.facebook.net/ja_JP/sdk.js#xfbml=1&version=v19.0"></script>

    <header>
        <div class="logo">㈱阿蘇J・Hファーム</div>
        <nav>
            <a href="/">HOME</a> /
            <a href="/about/">ABOUT</a> /
            牧場日記
        </nav>
    </header>

    <section class="diary-hero">
        <h1>牧場日記</h1>
        <p>産山高原から届ける、牛とともに過ごす毎日。</p>
    </section>

    <section class="diary-section">
        <p class="lead">
            日々の牧場の風景、季節の移ろい、若き三代目の挑戦――<br>
            農場の今を、Facebookページから随時お届けしています。
        </p>

        <!--
            ▼▼▼ Facebookページ埋め込み ▼▼▼
            連携先: 株式会社阿蘇J・Hファーム Facebookページ
            URL変更時は data-href / cite / <a href> の3か所をすべて書き換えること
        -->
        <div class="fb-wrapper">
            <div class="fb-page"
                data-href="https://www.facebook.com/profile.php?id=61591557386529"
                data-tabs="timeline"
                data-width="800"
                data-height="800"
                data-small-header="false"
                data-adapt-container-width="true"
                data-hide-cover="false"
                data-show-facepile="true">
                <blockquote cite="https://www.facebook.com/profile.php?id=61591557386529"
                    class="fb-xfbml-parse-ignore">
                    <a href="https://www.facebook.com/profile.php?id=61591557386529">牧場日記</a>
                </blockquote>
            </div>
        </div>
        <!-- ▲▲▲ Facebookページ埋め込み ここまで ▲▲▲ -->
    </section>

    <footer>
        <p>© 株式会社阿蘇J・Hファーム</p>
        <p>
            <a href="/">HOME</a> /
            <a href="/blog/">牧場日記</a>
        </p>
    </footer>
</body>
</html>
