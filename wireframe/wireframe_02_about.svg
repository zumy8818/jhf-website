  <rect x="640" y="1210" width="460" height="16" fill="#e0e0e0" rx="3"/>
  <rect x="640" y="1240" width="420" height="16" fill="#e0e0e0" rx="3"/>
  <rect x="640" y="1270" width="460" height="16" fill="#e0e0e0" rx="3"/>
