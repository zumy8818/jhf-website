  <line x1="0" y1="80" x2="1200" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="1200" y1="80" x2="0" y2="440" stroke="#cccccc" stroke-width="1.5"/>
  <text x="600" y="230" text-anchor="middle" font-size="14" fill="#aaaaaa">風景写真（阿蘇・牧場イメージ）</text>
