  <rect x="40" y="15" width="200" height="50" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="140" y="43" text-anchor="middle" font-size="13" fill="#666666">㈱阿蘇J・Hファーム</text>
  <text x="140" y="57" text-anchor="middle" font-size="10" fill="#999999">ロゴ</text>
  <!-- グローバルナビ -->
  <text x="580" y="46" text-anchor="middle" font-size="13" fill="#999999">TOP</text>
  <!-- ABOUTアクティブ -->
  <rect x="630" y="25" width="72" height="30" fill="#333333" rx="2"/>
  <text x="666" y="44" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">ABOUT</text>
  <text x="760" y="46" text-anchor="middle" font-size="13" fill="#999999">MESSAGE</text>
  <text x="860" y="46" text-anchor="middle" font-size="13" fill="#999999">SYSTEM</text>
  <text x="945" y="46" text-anchor="middle" font-size="13" fill="#999999">BLOG</text>
  <text x="1060" y="46" text-anchor="middle" font-size="13" fill="#999999">PRESS RELEASE</text>
  <!-- ヘッダー区切り -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#dddddd" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- セクションラベル：ヘッダー -->
  <text x="8" y="12" font-size="10" fill="#aaaaaa">① HEADER</text>


