  <rect x="200" y="615" width="200" height="50" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="645" text-anchor="middle" font-size="13" fill="#555555" font-weight="bold">設立</text>
  <rect x="400" y="615" width="600" height="50" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="645" text-anchor="middle" font-size="13" fill="#333333">〇〇〇〇年〇月</text>

  <!-- 行3: 代表者 -->
  <rect x="200" y="665" width="200" height="50" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="695" text-anchor="middle" font-size="13" fill="#555555" font-weight="bold">代表者</text>
  <rect x="400" y="665" width="600" height="50" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="695" text-anchor="middle" font-size="13" fill="#333333">代表取締役　井　真琴</text>

  <!-- 行4: 所在地 -->
  <rect x="200" y="715" width="200" height="50" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="745" text-anchor="middle" font-size="13" fill="#555555" font-weight="bold">所在地</text>
  <rect x="400" y="715" width="600" height="50" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="745" text-anchor="middle" font-size="13" fill="#333333">熊本県阿蘇郡産山村大利665-1</text>

  <!-- 行5: 事業内容 -->
  <rect x="200" y="765" width="200" height="50" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="795" text-anchor="middle" font-size="13" fill="#555555" font-weight="bold">事業内容</text>
  <rect x="400" y="765" width="600" height="50" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="795" text-anchor="middle" font-size="13" fill="#333333">和牛繁殖・一貫飼育、牛肉の生産・販売</text>

  <!-- 行6: 従業員数 -->
  <rect x="200" y="815" width="200" height="50" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="845" text-anchor="middle" font-size="13" fill="#555555" font-weight="bold">従業員数</text>
  <rect x="400" y="815" width="600" height="50" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="845" text-anchor="middle" font-size="13" fill="#333333">6名</text>

