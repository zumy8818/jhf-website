  <line x1="1165" y1="0" x2="1165" y2="2760" stroke="#dddddd" stroke-width="0.5" stroke-dasharray="2,4"/>
  <text x="1170" y="40" font-size="9" fill="#cccccc" transform="rotate(90, 1170, 40)">1200px</text>

  <!-- 凡例 -->
