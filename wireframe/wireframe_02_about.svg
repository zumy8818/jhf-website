  <text x="300" y="900" text-anchor="middle" font-size="13" fill="#555555" font-weight="bold">資本金</text>
  <rect x="400" y="865" width="600" height="60" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="900" text-anchor="middle" font-size="13" fill="#333333">1,000万円</text>

