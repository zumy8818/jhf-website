  <!-- タイムライン行4: 令和7年（現在・未記入） -->
  <circle cx="600" cy="1840" r="8" fill="#555555" stroke="#333333" stroke-width="2"/>
  <text x="555" y="1844" text-anchor="end" font-size="14" fill="#333333" font-weight="bold">令和7年</text>
