  <rect x="100" y="2375" width="360" height="16" fill="#e8e8e8" rx="2"/>
  <rect x="100" y="2405" width="390" height="16" fill="#e8e8e8" rx="2"/>
  <text x="100" y="2345" font-size="11" fill="#aaaaaa">・車でのアクセス（国道・ICからの経路）</text>
  <text x="100" y="2375" font-size="11" fill="#aaaaaa">・公共交通でのアクセス</text>
  <text x="100" y="2405" font-size="11" fill="#aaaaaa">・駐車場情報</text>
  <!-- お問い合わせボタン -->
