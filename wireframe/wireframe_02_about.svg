<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3200" viewBox="0 0 1200 3200" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">

  <!-- 背景 -->
  <rect width="1200" height="3200" fill="#f5f5f5"/>

  <!-- ===== 1. ヘッダー ===== -->
  <rect x="0" y="0" width="1200" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
