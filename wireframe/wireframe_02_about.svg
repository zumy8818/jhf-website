  <text x="650" y="1608" font-size="13" fill="#555555">コンセプトに㈱北九畜産設立</text>

  <!-- タイムライン行2: 平成15年 -->
  <circle cx="600" cy="1680" r="8" fill="#333333"/>
  <text x="555" y="1684" text-anchor="end" font-size="14" fill="#333333" font-weight="bold">平成15年</text>
  <rect x="630" y="1667" width="530" height="30" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="650" y="1686" font-size="13" fill="#555555">㈱阿蘇J・Hファーム設立（分社化）</text>

  <!-- タイムライン行3: 平成30年 -->
  <circle cx="600" cy="1760" r="8" fill="#333333"/>
