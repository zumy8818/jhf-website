  <text x="180" y="2638" text-anchor="middle" font-size="13" fill="#aaaaaa">㈱阿蘇J・Hファーム</text>
  <text x="180" y="2652" text-anchor="middle" font-size="10" fill="#777777">フッターロゴ</text>
  <!-- フッターナビ -->
  <text x="600" y="2635" text-anchor="middle" font-size="12" fill="#999999">TOP　|　ABOUT　|　MESSAGE　|　SYSTEM　|　BLOG　|　PRESS RELEASE</text>
  <!-- フッター住所 -->
  <text x="600" y="2665" text-anchor="middle" font-size="11" fill="#777777">熊本県阿蘇郡産山村 　TEL: 〇〇〇-〇〇〇〇-〇〇〇〇</text>
  <!-- 区切り線 -->
  <line x1="80" y1="2695" x2="1120" y2="2695" stroke="#555555" stroke-width="1"/>
