  <text x="220" y="2825" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold">凡 例</text>
  <line x1="40" y1="2835" x2="400" y2="2835" stroke="#eeeeee" stroke-width="1"/>
  <!-- 凡例項目 -->
  <rect x="40" y="2845" width="40" height="25" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="40" y1="2845" x2="80" y2="2870" stroke="#cccccc" stroke-width="1"/>
  <line x1="80" y1="2845" x2="40" y2="2870" stroke="#cccccc" stroke-width="1"/>
  <text x="95" y="2862" font-size="12" fill="#555555">画像プレースホルダー（×斜線）</text>
  <rect x="40" y="2880" width="40" height="20" fill="#e0e0e0" rx="2"/>
