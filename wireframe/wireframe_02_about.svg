  <!-- 右: Googleマップ埋め込みエリア -->
  <rect x="580" y="2175" width="540" height="340" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1.5"/>
  <line x1="580" y1="2175" x2="1120" y2="2515" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="1120" y1="2175" x2="580" y2="2515" stroke="#cccccc" stroke-width="1.5"/>
  <text x="850" y="2340" text-anchor="middle" font-size="14" fill="#aaaaaa">Google マップ 埋め込みエリア</text>
  <text x="850" y="2365" text-anchor="middle" font-size="11" fill="#bbbbbb">iframe embed</text>

  <!-- セクション区切り -->
  <line x1="0" y1="2580" x2="1200" y2="2580" stroke="#dddddd" stroke-width="1" stroke-dasharray="6,3"/>
