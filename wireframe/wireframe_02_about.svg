  <text x="555" y="1594" text-anchor="end" font-size="14" fill="#333333" font-weight="bold">昭和49年</text>
  <rect x="630" y="1572" width="530" height="44" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2"/>
