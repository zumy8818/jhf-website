name: ロリポップ SFTP デプロイ

# mainブランチにpushされたら自動でロリポップにデプロイ
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: ロリポップにSFTPデプロイ
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USERNAME }}
          password:    ${{ secrets.SSH_PASSWORD }}
          port:        2222
          local_path:  ./
          remote_path: aso-jh-farm.jp/
          # デプロイ不要なファイルを除外
          args: >
            --exclude=.git
            --exclude=.github
            --exclude=CNAME
            --exclude=*.md
            --exclude=*.txt
            --exclude=wireframe
