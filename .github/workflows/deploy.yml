name: ロリポップ SCP デプロイ

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # aboutフォルダとCSSをデプロイ
      - name: aboutフォルダとCSSをデプロイ
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          source:   "about,css"
          target:   "aso-jh-farm.jp/"

      # デプロイ後にサーバーの中身を確認
      - name: デプロイ結果を確認
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          script: |
            echo "=== about/ の中身 ==="
            ls -la ~/aso-jh-farm.jp/about/
            echo "=== css/ の中身 ==="
            ls -la ~/aso-jh-farm.jp/css/
