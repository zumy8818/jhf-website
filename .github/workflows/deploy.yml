name: ロリポップ SCP デプロイ

# mainブランチにpushされたら自動でロリポップにデプロイ
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # about/ と css/ をフォルダ名ごとロリポップにSCPで転送
      # source にスラッシュをつけない → フォルダ名が保持される
      # 結果: aso-jh-farm.jp/about/index.html, aso-jh-farm.jp/css/style.css
      - name: aboutフォルダとCSSをデプロイ
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          source:   "about,css"
          target:   "aso-jh-farm.jp/"
