name: ロリポップ SCP デプロイ

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # web/フォルダの構造を調査（本当のWebルートを特定）
      - name: webフォルダの構造を確認
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          script: |
            echo "=== ~/web/ の中身 ==="
            ls -la ~/web/ 2>/dev/null || echo "webフォルダなし"
            echo "=== ~/web/aso-jh-farm.jp/ の中身 ==="
            ls -la ~/web/aso-jh-farm.jp/ 2>/dev/null || echo "フォルダなし"
            echo "=== シンボリックリンク確認 ==="
            ls -la ~/ | grep "\->"
