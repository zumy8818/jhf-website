name: デプロイ → ロリポップ（aso-jh-farm.jp）

on:
  push:
    branches: [main]

env:
  TARGET_PATH: "/home/users/1/hippy.jp-scarecrowman8818/web/aso-jh-farm.jp"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # ── 配信用クリーンディレクトリを作成 ──────────────────
      # 除外リスト方式（rm -rf 個別ファイル）は新しいドットファイルが
      # 増えるたびに漏れるため廃止。公開してよいものだけをコピーする。
      - name: 配信用ディレクトリを作成
        run: |
          mkdir -p .deploy
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deploy/' \
            --exclude='README.md' \
            --exclude='CNAME' \
            --exclude='wireframe/' \
            --exclude='.ftp-deploy-sync-state.json' \
            ./ .deploy/

      # ロリポップの ~/web/aso-jh-farm.jp/ へSCPコピー（.deploy配下のみ）
      - name: SCPデプロイ
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          source:   ".deploy/*"
          target:   ${{ env.TARGET_PATH }}

      # ── 本番反映確認（.git・.github・.envが残っていないこと）──
      - name: 本番反映確認（.git等の露出がないこと）
        run: |
          LISTING=$(curl -s --user "${{ secrets.SSH_USERNAME }}:${{ secrets.SSH_PASSWORD }}" \
            "sftp://${{ secrets.SSH_HOST }}:2222${{ env.TARGET_PATH }}/" -l)
          FOUND=""
          for p in ".git" ".github" ".env" ".env.local"; do
            if echo "$LISTING" | grep -qx "$p"; then
              FOUND="$FOUND $p"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "::error::本番に残っています:$FOUND"
            exit 1
          fi

      # Slack通知（SLACK_WEBHOOK_URL 未設定でもエラーにしない）
      - name: Slack通知
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *JHFサイト デプロイ ${{ job.status }}*\nコミット: ${{ github.event.head_commit.message }}\nhttps://github.com/${{ github.repository }}/actions"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
