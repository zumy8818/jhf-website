name: ロリポップ SCP デプロイ

# mainブランチにpushされたら自動でロリポップにデプロイ
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # about/ と css/ フォルダをロリポップにSCPで転送（パスワード認証・再帰コピー対応）
      - name: aboutフォルダをデプロイ
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          source:   "about/"
          target:   "aso-jh-farm.jp/"

      - name: 共通CSSをデプロイ
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     2222
          source:   "css/"
          target:   "aso-jh-farm.jp/"
