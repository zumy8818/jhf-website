name: ロリポップ SFTP デプロイ

# mainブランチにpushされたら自動でロリポップにデプロイ
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: ロリポップにrsyncデプロイ（サブフォルダ含む再帰転送）
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # -a: アーカイブ（権限・タイムスタンプ保持）
          # -v: 詳細ログ
          # -z: 圧縮転送
          # -r: サブフォルダも再帰的にコピー
          switches: >-
            -avzr
            --exclude='.git'
            --exclude='.github'
            --exclude='CNAME'
            --exclude='*.md'
            --exclude='*.txt'
            --exclude='wireframe'
          path: ./
          remote_path: aso-jh-farm.jp/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: 2222
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_password: ${{ secrets.SSH_PASSWORD }}
